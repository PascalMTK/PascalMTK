<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="profile.ts — role: Software Engineer; focus: Full Stack, Web, Mobile; values: clean architecture, thoughtful UX, reliability; location: Namibia; status: open to work.">
  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; font-size: 17px; }
    text { white-space: pre; }
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .l { opacity: 0; animation: reveal .35s ease-out forwards; }
    @keyframes reveal { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
    .k { fill: #C084FC; } .p { fill: #E2E8F0; } .s { fill: #FDBA74; } .n { fill: #64748B; } .f { fill: #22D3EE; } .g { fill: #4ADE80; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#0E1328"/>
    </linearGradient>
    <radialGradient id="halo" cx="1080" cy="40" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".10"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="430" rx="18" fill="url(#halo)"/>
  <rect x=".5" y=".5" width="1199" height="429" rx="18" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>

  <!-- title bar -->
  <path d="M18 .5H1182A17.5 17.5 0 0 1 1199.5 18V48H.5V18A17.5 17.5 0 0 1 18 .5Z" fill="#FFFFFF" fill-opacity=".03"/>
  <line x1="0" y1="48.5" x2="1200" y2="48.5" stroke="#FFFFFF" stroke-opacity=".07"/>
  <circle cx="30" cy="24" r="6" fill="#F43F5E"/>
  <circle cx="52" cy="24" r="6" fill="#FB923C"/>
  <circle cx="74" cy="24" r="6" fill="#4ADE80"/>
  <text class="sans" x="600" y="29" font-size="13" fill="#64748B" text-anchor="middle" letter-spacing=".5">pascal@namibia — profile.ts</text>

  <!-- line numbers -->
  <g class="mono" fill="#334155" text-anchor="end" font-size="15">
    <text x="58" y="94">1</text><text x="58" y="124">2</text><text x="58" y="154">3</text><text x="58" y="184">4</text>
    <text x="58" y="214">5</text><text x="58" y="244">6</text><text x="58" y="274">7</text><text x="58" y="304">8</text>
    <text x="58" y="334">9</text><text x="58" y="364">10</text><text x="58" y="394">11</text>
  </g>

  <g class="mono" transform="translate(84 0)" xml:space="preserve">
    <text class="l n" x="0" y="94" style="animation-delay:.1s">// a quick look at who I am and how I work</text>
    <text class="l" x="0" y="124" style="animation-delay:.25s"><tspan class="k">const</tspan><tspan class="p"> pascal </tspan><tspan class="k">=</tspan><tspan class="p"> {</tspan></text>
    <text class="l" x="0" y="154" style="animation-delay:.4s"><tspan class="f">  role</tspan><tspan class="p">:       </tspan><tspan class="s">"Software Engineer"</tspan><tspan class="p">,</tspan></text>
    <text class="l" x="0" y="184" style="animation-delay:.55s"><tspan class="f">  focus</tspan><tspan class="p">:      [</tspan><tspan class="s">"Full Stack"</tspan><tspan class="p">, </tspan><tspan class="s">"Web"</tspan><tspan class="p">, </tspan><tspan class="s">"Mobile"</tspan><tspan class="p">],</tspan></text>
    <text class="l" x="0" y="214" style="animation-delay:.7s"><tspan class="f">  builds</tspan><tspan class="p">:     </tspan><tspan class="s">"responsive, high-performance digital products"</tspan><tspan class="p">,</tspan></text>
    <text class="l" x="0" y="244" style="animation-delay:.85s"><tspan class="f">  values</tspan><tspan class="p">:     [</tspan><tspan class="s">"clean architecture"</tspan><tspan class="p">, </tspan><tspan class="s">"thoughtful UX"</tspan><tspan class="p">, </tspan><tspan class="s">"reliability"</tspan><tspan class="p">],</tspan></text>
    <text class="l" x="0" y="274" style="animation-delay:1s"><tspan class="f">  mindset</tspan><tspan class="p">:    </tspan><tspan class="s">"solve the problem first, then write the code"</tspan><tspan class="p">,</tspan></text>
    <text class="l" x="0" y="304" style="animation-delay:1.15s"><tspan class="f">  location</tspan><tspan class="p">:   </tspan><tspan class="s">"Namibia"</tspan><tspan class="p">,</tspan></text>
    <text class="l" x="0" y="334" style="animation-delay:1.3s"><tspan class="f">  openToWork</tspan><tspan class="p">: </tspan><tspan class="k">true</tspan><tspan class="p">,</tspan></text>
    <text class="l" x="0" y="364" style="animation-delay:1.45s"><tspan class="p">};</tspan></text>
    <text class="l" x="0" y="394" style="animation-delay:1.6s"><tspan class="g">❯ </tspan><tspan class="p">pascal.</tspan><tspan class="f">collaborate</tspan><tspan class="p">(</tspan><tspan class="s">"you"</tspan><tspan class="p">)</tspan><tspan class="cursor" fill="#FB923C"> ▍</tspan></text>
  </g>

  <!-- status pill -->
  <g transform="translate(1000 370)">
    <rect width="168" height="34" rx="17" fill="#4ADE80" fill-opacity=".1" stroke="#4ADE80" stroke-opacity=".35"/>
    <circle cx="22" cy="17" r="5" fill="#4ADE80">
      <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text class="sans" x="36" y="22" font-size="14" font-weight="600" fill="#4ADE80">available for work</text>
  </g>
</svg>
