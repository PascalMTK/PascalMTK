<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Pascal Mutaka — Software Engineer, Full Stack. Namibia.">
  <style>
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .fade { opacity: 0; animation: fade .9s ease-out forwards; }
    .d1 { animation-delay: .15s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .75s; } .d4 { animation-delay: 1.05s; } .d5 { animation-delay: 1.35s; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .tw { animation: tw 3.2s ease-in-out infinite; }
    .tw2 { animation: tw 4.6s ease-in-out infinite 1.2s; }
    .tw3 { animation: tw 2.6s ease-in-out infinite .6s; }
    @keyframes tw { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sun { animation: rise 2.4s cubic-bezier(.2,.7,.2,1) forwards; transform: translateY(40px); }
    @keyframes rise { to { transform: translateY(0); } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="400" rx="22"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070A16"/>
      <stop offset=".45" stop-color="#121433"/>
      <stop offset=".78" stop-color="#3A1C44"/>
      <stop offset="1" stop-color="#7A2E3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="900" cy="300" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB923C" stop-opacity=".55"/>
      <stop offset=".4" stop-color="#F43F5E" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset=".55" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B2140"/>
      <stop offset="1" stop-color="#2A1233"/>
    </linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E1336"/>
      <stop offset="1" stop-color="#160D27"/>
    </linearGradient>
    <linearGradient id="dune3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121027"/>
      <stop offset="1" stop-color="#0A0D1C"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0"/>
      <stop offset=".6" stop-color="#FB923C" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="sunDisc"><circle cx="905" cy="270" r="96"/></clipPath>
    <clipPath id="sunClip"><rect x="700" y="0" width="420" height="292"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#sky)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect width="1200" height="400" fill="url(#glow)"/>

    <!-- stars -->
    <g fill="#E2E8F0">
      <circle class="tw" cx="540" cy="48" r="1.4"/>
      <circle class="tw2" cx="612" cy="96" r="1"/>
      <circle class="tw3" cx="700" cy="34" r="1.2"/>
      <circle class="tw" cx="780" cy="80" r=".9"/>
      <circle class="tw2" cx="860" cy="40" r="1.5"/>
      <circle class="tw3" cx="955" cy="70" r="1"/>
      <circle class="tw" cx="1040" cy="30" r="1.3"/>
      <circle class="tw2" cx="1120" cy="88" r="1"/>
      <circle class="tw3" cx="1160" cy="44" r=".8"/>
      <circle class="tw2" cx="660" cy="150" r=".8"/>
      <circle class="tw" cx="1010" cy="130" r=".8"/>
      <circle class="tw3" cx="470" cy="120" r=".9"/>
      <circle class="tw" cx="1090" cy="160" r=".7"/>
    </g>

    <!-- setting sun with horizon bands -->
    <g clip-path="url(#sunClip)">
      <g class="sun">
        <circle cx="905" cy="270" r="96" fill="url(#sunG)"/>
        <g fill="#3A1C44" clip-path="url(#sunDisc)">
          <rect x="800" y="236" width="210" height="4"/>
          <rect x="800" y="250" width="210" height="6"/>
          <rect x="800" y="266" width="210" height="8"/>
          <rect x="800" y="284" width="210" height="10"/>
        </g>
      </g>
    </g>

    <!-- dunes -->
    <path d="M0 300 C140 262 250 250 380 276 C470 294 560 250 690 232 C800 218 870 262 960 270 C1060 278 1130 250 1200 238 V400 H0Z" fill="url(#dune1)"/>
    <path d="M690 232 C800 218 870 262 960 270 C1060 278 1130 250 1200 238" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    <path d="M0 330 C120 310 220 300 330 318 C430 334 520 296 640 290 C760 284 830 320 930 326 C1040 332 1120 304 1200 296 V400 H0Z" fill="url(#dune2)"/>
    <path d="M0 362 C150 344 300 336 450 350 C580 362 700 338 840 340 C980 342 1080 360 1200 352 V400 H0Z" fill="url(#dune3)"/>

    <!-- text -->
    <g transform="translate(64 0)">
      <text class="mono fade d1" x="0" y="88" font-size="16" fill="#22D3EE" letter-spacing=".5">
        <tspan fill="#64748B">~/</tspan>pascal<tspan fill="#64748B"> $ </tspan><tspan fill="#E2E8F0">whoami</tspan>
      </text>
      <text class="sans fade d2" x="-3" y="160" font-size="68" font-weight="800" fill="#F8FAFC" letter-spacing="-2">Pascal Mutaka</text>
      <rect class="fade d3" x="0" y="180" width="120" height="4" rx="2" fill="url(#accent)"/>
      <text class="sans fade d3" x="0" y="220" font-size="24" font-weight="500" fill="#CBD5E1">Software Engineer <tspan fill="#475569">/</tspan> Full Stack Developer</text>
      <text class="mono fade d4" x="0" y="252" font-size="15" fill="#94A3B8">web · mobile · clean architecture · thoughtful UX<tspan class="cursor" fill="#FB923C"> ▍</tspan></text>
    </g>

    <!-- coordinates -->
    <g class="mono fade d5" font-size="12" letter-spacing="2">
      <text x="64" y="378" fill="#64748B">22.96°S  18.49°E</text>
      <text x="1136" y="378" fill="#64748B" text-anchor="end">NAMIBIA · UTC+2</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
