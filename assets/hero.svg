<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Pascal Mutaka — Software Engineer, Full Stack Developer. Namibia.">
  <style>
    text { white-space: pre; }
    .sans { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .fade { opacity: 0; animation: fade .9s cubic-bezier(.2,.7,.2,1) forwards; }
    .d1 { animation-delay: .1s; } .d2 { animation-delay: 1s; } .d3 { animation-delay: 1.35s; } .d5 { animation-delay: 2.2s; }
    @keyframes fade { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    .tw  { animation: tw 3.2s ease-in-out infinite; }
    .tw2 { animation: tw 4.6s ease-in-out infinite 1.2s; }
    .tw3 { animation: tw 2.6s ease-in-out infinite .6s; }
    @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sun { transform: translateY(70px); animation: rise 3s cubic-bezier(.2,.7,.2,1) forwards .2s; }
    @keyframes rise { to { transform: translateY(0); } }
    .glow { animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .75; } 50% { opacity: 1; } }
    .dune-back { animation: sway 14s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: translateX(-12px); } to { transform: translateX(12px); } }
    .sand { animation: drift linear infinite; opacity: 0; }
    @keyframes drift {
      0%   { transform: translate(0,0); opacity: 0; }
      15%  { opacity: .7; }
      85%  { opacity: .5; }
      100% { transform: translate(260px,-18px); opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="400" rx="22"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070A16"/>
      <stop offset=".45" stop-color="#121433"/>
      <stop offset=".78" stop-color="#3A1C44"/>
      <stop offset="1" stop-color="#7A2E3A"/>
    </linearGradient>
    <radialGradient id="glowG" cx="900" cy="300" r="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB923C" stop-opacity=".6"/>
      <stop offset=".4" stop-color="#F43F5E" stop-opacity=".18"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset=".55" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="dune1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5B2140"/><stop offset="1" stop-color="#2A1233"/></linearGradient>
    <linearGradient id="dune2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2E1336"/><stop offset="1" stop-color="#160D27"/></linearGradient>
    <linearGradient id="dune3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#121027"/><stop offset="1" stop-color="#0A0D1C"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FB923C" stop-opacity="0"/>
      <stop offset=".6" stop-color="#FB923C" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <!-- shimmer sweeping across the name -->
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-300" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset=".45" stop-color="#F8FAFC"/>
      <stop offset=".5" stop-color="#A5F3FC"/>
      <stop offset=".55" stop-color="#FED7AA"/>
      <stop offset=".6" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#F8FAFC"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-300 0;1100 0;1100 0" keyTimes="0;.35;1" dur="7s" begin="2s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".95"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity=".035"/>
    </pattern>
    <clipPath id="sunDisc"><circle cx="905" cy="270" r="96"/></clipPath>
    <clipPath id="sunClip"><rect x="700" y="0" width="420" height="292"/></clipPath>
    <!-- typing reveal for the prompt -->
    <clipPath id="typeCmd">
      <rect x="0" y="60" height="40" width="0">
        <animate attributeName="width" begin=".3s" dur=".7s" fill="freeze" calcMode="discrete"
          values="0;10;19;29;38;48;58;67;77;86;96;106;115;125;134;144;154;163;173;400"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#sky)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <rect class="glow" width="1200" height="400" fill="url(#glowG)"/>

    <!-- stars -->
    <g fill="#E2E8F0">
      <circle class="tw" cx="540" cy="48" r="1.4"/><circle class="tw2" cx="612" cy="96" r="1"/>
      <circle class="tw3" cx="700" cy="34" r="1.2"/><circle class="tw" cx="780" cy="80" r=".9"/>
      <circle class="tw2" cx="860" cy="40" r="1.5"/><circle class="tw3" cx="955" cy="70" r="1"/>
      <circle class="tw" cx="1040" cy="30" r="1.3"/><circle class="tw2" cx="1120" cy="88" r="1"/>
      <circle class="tw3" cx="1160" cy="44" r=".8"/><circle class="tw2" cx="660" cy="150" r=".8"/>
      <circle class="tw" cx="1010" cy="130" r=".8"/><circle class="tw3" cx="470" cy="120" r=".9"/>
      <circle class="tw" cx="1090" cy="160" r=".7"/><circle class="tw2" cx="740" cy="120" r=".7"/>
    </g>

    <!-- shooting stars -->
    <g opacity="0">
      <rect x="-90" y="-1" width="90" height="2" rx="1" fill="url(#trail)"/>
      <animateTransform attributeName="transform" type="translate" values="1150 20;870 120;870 120" keyTimes="0;.12;1" dur="9s" begin="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.04;.12;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="-70" y="-1" width="70" height="1.5" rx="1" fill="url(#trail)"/>
      <animateTransform attributeName="transform" type="translate" values="820 10;600 90;600 90" keyTimes="0;.1;1" dur="13s" begin="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.9;0;0" keyTimes="0;.03;.1;1" dur="13s" begin="7.5s" repeatCount="indefinite"/>
    </g>

    <!-- setting sun -->
    <g clip-path="url(#sunClip)">
      <g class="sun">
        <circle cx="905" cy="270" r="96" fill="url(#sunG)"/>
        <g fill="#3A1C44" clip-path="url(#sunDisc)">
          <rect x="800" y="236" width="210" height="4"><animate attributeName="y" values="236;232;236" dur="5s" repeatCount="indefinite"/></rect>
          <rect x="800" y="250" width="210" height="6"><animate attributeName="y" values="250;246;250" dur="5s" begin=".4s" repeatCount="indefinite"/></rect>
          <rect x="800" y="266" width="210" height="8"><animate attributeName="y" values="266;262;266" dur="5s" begin=".8s" repeatCount="indefinite"/></rect>
          <rect x="800" y="284" width="210" height="10"><animate attributeName="y" values="284;280;284" dur="5s" begin="1.2s" repeatCount="indefinite"/></rect>
        </g>
      </g>
    </g>

    <!-- dunes -->
    <g class="dune-back">
      <path d="M-40 300 C140 262 250 250 380 276 C470 294 560 250 690 232 C800 218 870 262 960 270 C1060 278 1130 250 1240 238 V400 H-40Z" fill="url(#dune1)"/>
      <path d="M690 232 C800 218 870 262 960 270 C1060 278 1130 250 1240 238" fill="none" stroke="url(#rim)" stroke-width="1.6"/>
    </g>
    <path d="M0 330 C120 310 220 300 330 318 C430 334 520 296 640 290 C760 284 830 320 930 326 C1040 332 1120 304 1200 296 V400 H0Z" fill="url(#dune2)"/>

    <!-- wind-blown sand -->
    <g fill="#FDBA74">
      <circle class="sand" cx="560" cy="300" r="1.2" style="animation-duration:6s"/>
      <circle class="sand" cx="700" cy="296" r="1" style="animation-duration:7s;animation-delay:1.5s"/>
      <circle class="sand" cx="820" cy="318" r="1.4" style="animation-duration:5.5s;animation-delay:3s"/>
      <circle class="sand" cx="480" cy="322" r=".9" style="animation-duration:8s;animation-delay:.8s"/>
      <circle class="sand" cx="900" cy="330" r="1" style="animation-duration:6.5s;animation-delay:4.2s"/>
      <circle class="sand" cx="640" cy="336" r="1.1" style="animation-duration:7.5s;animation-delay:2.4s"/>
      <circle class="sand" cx="380" cy="340" r=".8" style="animation-duration:9s;animation-delay:5s"/>
    </g>

    <path d="M0 362 C150 344 300 336 450 350 C580 362 700 338 840 340 C980 342 1080 360 1200 352 V400 H0Z" fill="url(#dune3)"/>

    <!-- text -->
    <g transform="translate(64 0)">
      <g clip-path="url(#typeCmd)">
        <text class="mono" x="0" y="88" font-size="16" fill="#22D3EE" letter-spacing=".5"><tspan fill="#64748B">~/</tspan>pascal<tspan fill="#64748B"> $ </tspan><tspan fill="#E2E8F0">whoami</tspan></text>
      </g>
      <text class="sans fade d2" x="-3" y="160" font-size="68" font-weight="800" fill="url(#shine)" letter-spacing="-2">Pascal Mutaka</text>
      <rect x="0" y="180" width="0" height="4" rx="2" fill="url(#accent)">
        <animate attributeName="width" from="0" to="120" begin="1.3s" dur=".9s" fill="freeze" calcMode="spline" keySplines=".2 .7 .2 1"/>
      </rect>
      <text class="sans fade d3" x="0" y="220" font-size="24" font-weight="500" fill="#CBD5E1">Software Engineer <tspan fill="#475569">/</tspan> Full Stack Developer</text>

      <!-- rotating focus line -->
      <g class="mono" font-size="15" fill="#94A3B8">
        <text x="0" y="252" opacity="0"><tspan fill="#FB923C">&gt; </tspan>building responsive, high-performance products
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.04;.3;.333;1" dur="12s" begin="1.8s" repeatCount="indefinite"/></text>
        <text x="0" y="252" opacity="0"><tspan fill="#FB923C">&gt; </tspan>clean architecture · thoughtful UX
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.333;.373;.633;.666;1" dur="12s" begin="1.8s" repeatCount="indefinite"/></text>
        <text x="0" y="252" opacity="0"><tspan fill="#FB923C">&gt; </tspan>web · mobile · full stack — open to work
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.666;.706;.966;1" dur="12s" begin="1.8s" repeatCount="indefinite"/></text>
      </g>
    </g>

    <!-- coordinates -->
    <g class="mono fade d5" font-size="12" letter-spacing="2">
      <text x="64" y="378" fill="#64748B">22.96°S  18.49°E</text>
      <text x="1136" y="378" fill="#64748B" text-anchor="end">NAMIBIA · UTC+2</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="399" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
