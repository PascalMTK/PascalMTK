<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="“First, solve the problem. Then, write the code.” — John Johnson. Thanks for stopping by — let's build something useful.">
  <style>
    text { white-space: pre; }
    .sans  { font-family: 'Segoe UI', Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif; }
    .serif { font-family: Georgia, 'Times New Roman', serif; }
    .mono  { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Consolas, 'SFMono-Regular', Menlo, monospace; }
    .in { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .q { opacity: 0; animation: qin 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes qin { from { opacity: 0; transform: scale(.7); } to { opacity: .55; transform: scale(1); } }
    .line { transform-box: fill-box; transform-origin: center; transform: scaleX(0); animation: grow 1.1s cubic-bezier(.2,.7,.2,1) forwards 2.2s; }
    @keyframes grow { to { transform: scaleX(1); } }
    .glow { animation: breathe 6s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
    .arrow { animation: nudge 1.6s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    .tw { animation: tw 3s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
    .sand { opacity: 0; animation: drift linear infinite; }
    @keyframes drift { 0% { transform: translate(0,0); opacity: 0; } 20% { opacity: .7; } 100% { transform: translate(300px,-14px); opacity: 0; } }
    .dune { animation: sway 12s ease-in-out infinite alternate; }
    @keyframes sway { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1020"/><stop offset=".6" stop-color="#151436"/><stop offset="1" stop-color="#2E1538"/>
    </linearGradient>
    <radialGradient id="glowG" cx="600" cy="300" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FB923C" stop-opacity=".34"/><stop offset="1" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="qG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22D3EE"/><stop offset="1" stop-color="#FB923C"/></linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#FB923C"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="d1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3D1A3F"/><stop offset="1" stop-color="#1A0F2A"/></linearGradient>
    <linearGradient id="d2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14112A"/><stop offset="1" stop-color="#0A0D1C"/></linearGradient>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#sky)"/>
    <rect class="glow" width="1200" height="300" fill="url(#glowG)"/>
    <g fill="#E2E8F0">
      <circle class="tw" cx="120" cy="40" r="1.2"/><circle class="tw" cx="240" cy="96" r=".9" style="animation-delay:1s"/>
      <circle class="tw" cx="1000" cy="36" r="1.3" style="animation-delay:.5s"/><circle class="tw" cx="1100" cy="110" r=".9" style="animation-delay:1.8s"/>
      <circle class="tw" cx="900" cy="150" r=".8" style="animation-delay:2.4s"/><circle class="tw" cx="320" cy="30" r=".8" style="animation-delay:1.4s"/>
      <circle class="tw" cx="70" cy="170" r=".8" style="animation-delay:.9s"/><circle class="tw" cx="1150" cy="60" r=".7" style="animation-delay:2s"/>
    </g>

    <!-- big quote marks -->
    <g class="serif" font-size="120" font-weight="700" fill="url(#qG)">
      <text class="q" x="300" y="120" style="transform-origin:330px 80px">“</text>
      <text class="q" x="842" y="186" style="transform-origin:872px 150px;animation-delay:.3s">”</text>
    </g>

    <!-- quote, word by word -->
    <g class="sans" font-size="36" font-weight="700" text-anchor="middle">
      <text class="in" x="600" y="98" fill="#F8FAFC" style="animation-delay:.4s">
        <tspan>First,</tspan> <tspan>solve</tspan> <tspan>the</tspan> <tspan fill="#22D3EE">problem.</tspan>
      </text>
      <text class="in" x="600" y="146" fill="#F8FAFC" style="animation-delay:1.2s">
        <tspan>Then,</tspan> <tspan>write</tspan> <tspan>the</tspan> <tspan fill="#FB923C">code.</tspan>
      </text>
    </g>
    <text class="mono in" x="600" y="184" text-anchor="middle" font-size="14" fill="#94A3B8" letter-spacing="3" style="animation-delay:1.9s">— JOHN JOHNSON</text>

    <rect class="line" x="480" y="206" width="240" height="1.5" fill="url(#rule)"/>

    <!-- dunes -->
    <path class="dune" d="M-40 252 C160 232 300 228 440 240 C560 250 660 222 800 220 C940 218 1060 240 1240 234 V300 H-40Z" fill="url(#d1)"/>
    <g fill="#FDBA74">
      <circle class="sand" cx="300" cy="252" r="1.1" style="animation-duration:6s"/>
      <circle class="sand" cx="560" cy="258" r="1" style="animation-duration:7s;animation-delay:2s"/>
      <circle class="sand" cx="760" cy="248" r="1.3" style="animation-duration:5.5s;animation-delay:3.5s"/>
      <circle class="sand" cx="150" cy="262" r=".9" style="animation-duration:8s;animation-delay:1s"/>
    </g>
    <path d="M0 276 C200 264 380 262 560 270 C720 278 900 262 1200 268 V300 H0Z" fill="url(#d2)"/>

    <!-- sign-off -->
    <g class="in" style="animation-delay:2.6s">
      <text class="sans" x="590" y="241" text-anchor="middle" font-size="15" fill="#CBD5E1">Thanks for stopping by <tspan fill="#64748B">·</tspan> <tspan class="mono" font-size="14" fill="#94A3B8">let's build something useful</tspan></text>
      <text class="mono arrow" x="798" y="241" font-size="14" fill="#FB923C">→</text>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="299" rx="20" fill="none" stroke="#FFFFFF" stroke-opacity=".08"/>
</svg>
